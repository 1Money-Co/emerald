moniker = "test-0"
ethereum_config.execution_authrpc_address = "http://<RETH_IP>:8545"
ethereum_config.engine_authrpc_address = "http://<RETH_IP>:8551"
ethereum_config.jwt_token_path = "/home/emerald/jwt"
ethereum_config.eth_genesis_path="./assets/genesis.json"
el_node_type = "archive"
retry_config.initial_delay = "100ms"
retry_config.max_delay = "2s"
retry_config.max_elapsed_time = "20s"
fee_recipient = "0x4242424242424242424242424242424242424242"
num_certificates_to_retain = 64000
num_temp_blocks_retained = 0
prune_at_block_interval = 5
# Size, in bytes, of the redb storage cache. Default: 512 MiB.
redb_cache_size_bytes = 536870912

# ---------------------------------------------------------------------------
# Validator key source. Optional; defaults to the local file provider.
# See production-network/key-management.md for IAM, payload format and
# troubleshooting details.
# ---------------------------------------------------------------------------

# Default: read <home>/config/priv_validator_key.json from local disk.
# [key_provider]
# type = "file"

# AWS Secrets Manager ciphertext, decrypted by AWS KMS.
# [key_provider]
# type       = "aws_sm_kms"
# secret_id  = "emerald/validator-0/consensus-key"
# region     = "us-east-1"
# kms_key_id = "alias/emerald-validator-keys"
# kms_region = "us-west-2"            # optional; defaults to `region`
# [key_provider.kms_encryption_context] # optional; must match encrypt time exactly
# validator = "0"

# GCP Secret Manager ciphertext, decrypted by Cloud KMS. Authentication is ADC
# only. Copy all three values verbatim from the key ceremony handoff.
# [key_provider]
# type           = "gcp_sm_kms"
# secret_version = "projects/PROJECT/secrets/SECRET/versions/7"
# kms_crypto_key = "projects/PROJECT/locations/LOCATION/keyRings/RING/cryptoKeys/KEY"
# kms_aad        = "1money:mainnet:validator:1:general:v1"
